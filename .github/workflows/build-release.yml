name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'V*'
  pull_request:

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore EpubMerge.slnx -p:Platform=x64

      - name: Build
        run: dotnet build EpubMerge.slnx --configuration Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test EpubMerge.slnx --configuration Release -p:Platform=x64 --no-build --verbosity normal

  publish:
    name: Publish ${{ matrix.runtime }} ${{ matrix.mode }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/V')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            mode: SelfContained
          - runtime: win-x64
            mode: FrameworkDependent
          - runtime: win-arm64
            mode: SelfContained
          - runtime: win-arm64
            mode: FrameworkDependent

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        shell: pwsh
        run: .\publish.ps1 -RuntimeIdentifier ${{ matrix.runtime }} -DeploymentMode ${{ matrix.mode }} -Configuration Release -ExcludeXmlAndPdb -Clean

      - name: Smoke test CLI
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $modeDirectory = if ('${{ matrix.mode }}' -eq 'SelfContained') { 'self-contained' } else { 'framework-dependent' }
          & "publish\${{ matrix.runtime }}\$modeDirectory\cli\EpubMerge.Cli.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "CLI help command failed with exit code $LASTEXITCODE." }

      - name: Validate ARM64 CLI artifact
        if: matrix.runtime == 'win-arm64'
        shell: pwsh
        run: |
          $modeDirectory = if ('${{ matrix.mode }}' -eq 'SelfContained') { 'self-contained' } else { 'framework-dependent' }
          $cliPath = "publish\${{ matrix.runtime }}\$modeDirectory\cli\EpubMerge.Cli.exe"
          if (-not (Test-Path -LiteralPath $cliPath -PathType Leaf)) { throw "CLI artifact was not found: $cliPath" }

      - name: Validate executable architectures
        shell: pwsh
        run: |
          $modeDirectory = if ('${{ matrix.mode }}' -eq 'SelfContained') { 'self-contained' } else { 'framework-dependent' }
          $expected = if ('${{ matrix.runtime }}' -eq 'win-arm64') { 0xAA64 } else { 0x8664 }
          foreach ($relative in @('wpf\EpubMerge.Gui.exe', 'cli\EpubMerge.Cli.exe')) {
            $path = "publish\${{ matrix.runtime }}\$modeDirectory\$relative"
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne $expected) { throw "Wrong executable architecture: $path ($machine)" }
          }

      - name: Create archive
        shell: pwsh
        run: |
          $root = "publish\${{ matrix.runtime }}\${{ matrix.mode == 'SelfContained' && 'self-contained' || 'framework-dependent' }}"
          $archive = "${{ matrix.runtime }}-${{ matrix.mode }}.zip"
          Compress-Archive -Path "$root\wpf", "$root\cli" -DestinationPath $archive
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $archive))
          try {
            $folders = @($zip.Entries | ForEach-Object { ($_.FullName -split '[/\\]')[0] } | Sort-Object -Unique)
            if (($folders -join ',') -ne 'cli,wpf') { throw "Unexpected ZIP roots: $folders" }
          }
          finally { $zip.Dispose() }

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: epub-merge-${{ matrix.runtime }}-${{ matrix.mode }}
          path: ${{ matrix.runtime }}-${{ matrix.mode }}.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/V')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: epub-merge-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: RELEASE_NOTES.md
          files: artifacts/*.zip