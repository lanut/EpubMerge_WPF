name: Build Microsoft Store packages

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Store version: Major.Minor.Build.0 (for example 1.2.3.0)'
        type: string
        required: true
      demo:
        description: 'Use DEMO identity; never upload this package to Partner Center'
        type: boolean
        default: true
      compilation_mode:
        description: 'NativeAot is experimental until packaged runtime acceptance passes'
        type: choice
        options: [Managed, NativeAot]
        default: Managed

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Validate packaging failure cases
        shell: pwsh
        run: .\tests\Packaging\StorePackaging.Tests.ps1
      - name: Build and test both GUIs
        shell: pwsh
        run: |
          dotnet build EpubMerge.slnx -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'Solution build failed.' }
          dotnet test EpubMerge.slnx -c Release -p:Platform=x64 --no-build
          if ($LASTEXITCODE -ne 0) { throw 'Solution tests failed.' }

  package:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    env:
      REQUESTED_VERSION: ${{ inputs.package_version }}
      DEMO_MODE: ${{ inputs.demo }}
      COMPILATION_MODE: ${{ inputs.compilation_mode }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: microsoft/setup-msbuild@v2
      - name: Configure native compiler
        if: inputs.compilation_mode == 'NativeAot'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.runtime == 'win-arm64' && 'amd64_arm64' || 'amd64' }}
      - name: Build and validate unsigned MSIX
        shell: pwsh
        run: |
          $version = $env:REQUESTED_VERSION
          $demo = $env:DEMO_MODE -eq 'true'
          .\publish-store.ps1 -RuntimeIdentifier '${{ matrix.runtime }}' -PackageVersion $version -Demo:$demo -CompilationMode $env:COMPILATION_MODE
      - name: Upload Store submission artifacts (not a public Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ inputs.demo && 'DEMO-NOT-FOR-STORE' || 'STORE' }}-${{ inputs.compilation_mode }}-${{ matrix.runtime }}-${{ github.run_number }}
          path: publish\msix\**
          if-no-files-found: error
          retention-days: 14
